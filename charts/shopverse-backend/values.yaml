# ============================================================
# Shopverse Backend - Default Values
# ============================================================

nameOverride: ""
fullnameOverride: ""

# ------------------------------------------------------------
# Image
# ------------------------------------------------------------

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# ------------------------------------------------------------
# Application
# ------------------------------------------------------------

containerName: backend

terminationGracePeriodSeconds: 30

# ------------------------------------------------------------
# Labels
# ------------------------------------------------------------

labels:
  app.kubernetes.io/component: backend

# ------------------------------------------------------------
# Deployment
# ------------------------------------------------------------

deployment:
  replicas: 1

# ------------------------------------------------------------
# Service
# ------------------------------------------------------------

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

# ------------------------------------------------------------
# Service Account
# ------------------------------------------------------------

serviceAccount:
  create: false
  name: ""
  annotations: {}

# ------------------------------------------------------------
# Pod Annotations
# ------------------------------------------------------------

podAnnotations: {}

# ------------------------------------------------------------
# Pod Security Context
# ------------------------------------------------------------

podSecurityContext:
  enabled: true
  values:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000

# ------------------------------------------------------------
# Container Security Context
# ------------------------------------------------------------

containerSecurityContext:
  enabled: true
  values:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000

# ------------------------------------------------------------
# Environment Variables
# ------------------------------------------------------------

env:
  enabled: false
  values: []

# ------------------------------------------------------------
# Environment From ConfigMap / Secret
# ------------------------------------------------------------

envFrom:
  enabled: false
  values: []

# ------------------------------------------------------------
# ConfigMap
# ------------------------------------------------------------

configmap:
  enabled: false
  name: ""
  data: {}

# ------------------------------------------------------------
# Resources
# ------------------------------------------------------------

resources:
  enabled: true
  values:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ------------------------------------------------------------
# Probes
# ------------------------------------------------------------

startupProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8080
    failureThreshold: 10
    periodSeconds: 10

readinessProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10

livenessProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 30

# ------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------
# Node Scheduling
# ------------------------------------------------------------

nodeSelector: {}

affinity: {}

tolerations: []

topologySpreadConstraints: []

# ------------------------------------------------------------
# Image Pull Secrets
# ------------------------------------------------------------

imagePullSecrets: []
