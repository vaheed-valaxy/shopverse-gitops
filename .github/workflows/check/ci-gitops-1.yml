name: GitOps CI - Helm + Kubernetes Security

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'envs/**'
      - '.github/workflows/gitops-ci-pr.yml'
      - '.github/workflows/reusable-gitops-validation.yml'

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:

  # ============================================================
  # 1. Find changed values files
  # ============================================================

  Detect-Changes:
    name: Detect GitOps Changes
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        shell: bash
        run: |

          set -euo pipefail

          # Start with an empty list
          changes="[]"


          # Get every file changed in this PR
          while read -r file; do

            echo "Changed file: $file"


            # We only care about files like:
            #
            # envs/dev/values-backend.yaml
            # envs/qa/values-payment.yaml
            # envs/prod/values-order.yaml

            # if [[ "$file" =~ ^envs/([^/]+)/values-([^/]+)\.yaml$ ]]; then

            if [[ "$file" =~ ^envs/([^/]+)/values-(.+)\.yaml$ ]]; then

              # Extract environment and component
              environment="${BASH_REMATCH[1]}"
              component="${BASH_REMATCH[2]}"


              # Build paths
              chart_path="charts/$component"
              values_file="$file"


              echo "  Component   : $component"
              echo "  Environment : $environment"
              echo "  Chart       : $chart_path"
              echo "  Values      : $values_file"


              # Add this target to the list
              changes=$(jq \
                --arg component "$component" \
                --arg environment "$environment" \
                --arg chart_path "$chart_path" \
                --arg values_file "$values_file" \
                '. += [{
                  component: $component,
                  environment: $environment,
                  chart_path: $chart,
                  values_file: $values
                }]' \
                <<< "$changes")

            fi

          done <<(
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          )


          # Convert the list into a GitHub Actions matrix
          matrix="{\"include\":$(echo "$changes" | jq -c .)}"


          echo ""
          echo "=========================================="
          echo "Validation Matrix"
          echo "=========================================="

          echo "$matrix" | jq .


          # Send matrix to the next job
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. Run reusable validation workflow
  # ============================================================

  GitOps-Validation:
    name: ${{ matrix.component }} / ${{ matrix.environment }}
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.matrix != '{"include":[]}'

    permissions:
      contents: read
      security-events: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Detect-Changes.outputs.matrix) }}

    uses: ./.github/workflows/reusable-gitops-validation.yml
    with:
      component: ${{ matrix.component }}
      environment: ${{ matrix.environment }}
      chart-path: ${{ matrix.chart_path }}
      values-file: ${{ matrix.values_file }}
      runner: ubuntu-latest

    
